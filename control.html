<!DOCTYPE html>
<html>
<head>
<title>Control Panel</title>
<link rel="stylesheet" href="style.css">
<style>
/* Popup styling */
#hackPopup, #otpPopup {
  display:none;
  position:fixed;
  top:30%;
  left:30%;
  background:#fff;
  padding:20px;
  border:2px solid #000;
  z-index:1000;
}
</style>
</head>

<body>

<header>
<h1>Secure Authentication System</h1>
<p>Smart Lock Monitoring Dashboard</p>
</header>

<nav>
<a href="index.html">Home</a>
<a href="control.html">Control Panel</a>
<a href="about.html">About</a>
<a href="contact.html">Contact</a>
</nav>

<div class="container">

<h2>Door Control Dashboard</h2>

<p id="status">🔒 LOCKED</p>

<button onclick="connectSerial()">Connect Arduino</button>

<div class="buttons">
<button class="unlock" onclick="unlock()">Unlock Door</button>
<button class="lock" onclick="lock()">Lock Door</button>
</div>

<h3>Live Security Alerts</h3>
<div id="alertBox" class="alertBox">
System Waiting For Activity...
</div>

</div>

<!-- Hack Alert Popup -->
<div id="hackPopup">
<p>🚨 Multiple Failed Attempts Detected!</p>
<button onclick="closeHack()">Close</button>
</div>

<!-- OTP Popup -->
<div id="otpPopup">
<p id="otpText"></p>
<input type="text" id="otpInput" placeholder="Enter OTP">
<button onclick="verifyOTP()">Verify OTP</button>
<button onclick="closeOTP()">Close</button>
</div>

<script>
let port;
let writer;
let buffer = "";
let currentOTP = null;
let otpVerified = false;
let lockActive = false;

async function connectSerial() {
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 9600 });

    const encoder = new TextEncoderStream();
    encoder.readable.pipeTo(port.writable);
    writer = encoder.writable.getWriter();

    readSerial();

    alert("Arduino Connected Successfully");
  } catch (error) {
    alert("Connection Failed");
  }
}

async function readSerial() {
  const decoder = new TextDecoderStream();
  port.readable.pipeTo(decoder.writable);

  const reader = decoder.readable.getReader();

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;

    buffer += value;
    let lines = buffer.split("\n");
    buffer = lines.pop();

    lines.forEach(line => {
      updateSystem(line.trim());
    });
  }
}

function updateSystem(msg) {
  console.log("Arduino:", msg);

  let status = document.getElementById("status");
  let alertBox = document.getElementById("alertBox");

  // ---------- MULTIPLE FAIL ALERT ----------
  if (msg.includes("MULTIPLE_FAIL")) {
    lockActive = true;
    otpVerified = false;
    currentOTP = generateOTP();

    alertBox.innerText = "🚨 MULTIPLE FAILED ATTEMPTS";
    alertBox.className = "alertBox alert-hack";

    // Show OTP popup
    showOTPPopup(currentOTP);
    return;
  }

  // ---------- NORMAL EVENTS ----------
  if (msg.includes("UNLOCK")) {
    status.innerText = "🔓 UNLOCKED";
    status.style.color = "lime";

    alertBox.innerText = "🟢 Door Opened Successfully";
    alertBox.className = "alertBox alert-success";
  } else if (msg.includes("LOCK")) {
    status.innerText = "🔒 LOCKED";
    status.style.color = "red";

    alertBox.innerText = "Door Locked";
    alertBox.className = "alertBox";
  } else if (msg.includes("ACCESS_DENIED")) {
    alertBox.innerText = "⛔ Unauthorized RFID Detected";
    alertBox.className = "alertBox alert-danger";
  } else if (msg.includes("WRONG_PASSWORD")) {
    alertBox.innerText = "⚠ Wrong Password Attempt";
    alertBox.className = "alertBox alert-warning";
  } else if (msg.includes("HACK_ATTEMPT")) {
    // Optional: show hack popup if triggered separately
    document.getElementById("hackPopup").style.display = "flex";
  }
}

// ---------- OTP GENERATION ----------
function generateOTP() {
  return Math.floor(100000 + Math.random() * 900000); // 6-digit OTP
}

// ---------- SHOW OTP POPUP ----------
function showOTPPopup(otp) {
  const popup = document.getElementById("otpPopup");
  popup.style.display = "flex";

  document.getElementById("otpText").innerText =
    "Enter OTP sent: " + otp + " (simulated)";

  console.log("Generated OTP:", otp);
}

// ---------- VERIFY OTP ----------
function verifyOTP() {
  const input = document.getElementById("otpInput").value;
  const popup = document.getElementById("otpPopup");
  const alertBox = document.getElementById("alertBox");

  if (input == currentOTP) {
    alertBox.innerText = "✅ OTP Verified! You can try password again";
    alertBox.className = "alertBox alert-success";

    otpVerified = true;
    lockActive = false;
    currentOTP = null;

    if (writer) {
      writer.write("O"); // Send OTP verification to Arduino
    }

    popup.style.display = "none";
  } else {
    alertBox.innerText = "❌ Wrong OTP! Door still locked";
    alertBox.className = "alertBox alert-danger";
  }
}

// ---------- CLOSE POPUPS ----------
function closeOTP() { document.getElementById("otpPopup").style.display = "none"; }
function closeHack() { document.getElementById("hackPopup").style.display = "none"; }

// ---------- DOOR CONTROL ----------
function unlock() { if (!lockActive && writer) writer.write("U"); }
function lock() { if (writer) writer.write("L"); }

</script>

</body>
</html>
